<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>サンダー親父 〜怒りの自家発電〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241d18;
    --room-mid:#372a21;
    --wood:#8a5a35;
    --wood-deep:#5c3a20;
    --tatami:#97995c;
    --paper:#f0e6cc;
    --paper-dim:#c9bd9e;
    --spark-blue:#52d6f2;
    --spark-violet:#9d6dff;
    --spark-gold:#ffc93d;
    --alert-red:#ff5c4f;
    --skin-tone:#f0c093;
    --robe-color:#5c6b73;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; overscroll-behavior:none; background:var(--ink); }
  body{ position:fixed; inset:0; font-family:'Zen Maru Gothic', sans-serif; color:var(--paper); }

  .num{ font-family:'DotGothic16','Zen Maru Gothic',monospace; letter-spacing:0.5px; }

  button{ font-family:inherit; border:none; background:none; color:inherit; padding:0; cursor:pointer; }

  #app{
    position:absolute; inset:0;
    padding-top:var(--safe-t); padding-bottom:var(--safe-b);
    padding-left:var(--safe-l); padding-right:var(--safe-r);
    background:
      radial-gradient(ellipse at 50% 0%, var(--room-mid) 0%, var(--ink) 70%);
  }

  .screen{ position:absolute; inset:0; display:flex; flex-direction:column; }
  .hidden{ display:none !important; }

  /* ---------- START SCREEN ---------- */
  #start-screen{ padding:0 18px; }
  .start-scroll{ flex:1; overflow-y:auto; overflow-x:hidden; touch-action:pan-y; padding-bottom:14px; -webkit-overflow-scrolling:touch; }
  .start-scroll::-webkit-scrollbar{ width:4px; }
  .start-scroll::-webkit-scrollbar-thumb{ background:var(--wood); border-radius:4px; }

  .title-block{ text-align:center; padding:26px 0 10px; }
  .title-bolt{ width:34px; height:34px; margin:0 auto 6px; opacity:0; animation: boltIntro 1.1s ease-out 0.15s forwards; }
  .title-bolt path{ fill:var(--spark-gold); }
  h1.game-title{ font-size:26px; font-weight:900; margin:0; line-height:1.3; letter-spacing:1px; text-shadow:0 2px 0 var(--wood-deep); }
  .game-subtitle{ display:block; font-size:13px; font-weight:500; color:var(--paper-dim); margin-top:2px; letter-spacing:2px; }

  @keyframes boltIntro{
    0%{ opacity:0; transform:scale(0.4) rotate(-8deg); }
    60%{ opacity:1; transform:scale(1.15) rotate(4deg); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }

  .rule-text{ text-align:center; font-size:13px; line-height:1.7; color:var(--paper-dim); max-width:320px; margin:10px auto 18px; }

  .best-score-box{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--room-mid); border-radius:10px; padding:12px 16px; margin-bottom:20px;
    border-left:4px solid var(--spark-gold);
  }
  .best-score-box .label{ font-size:12px; color:var(--paper-dim); }
  .best-score-box .value{ font-size:15px; font-weight:700; }

  .section{ margin-bottom:22px; }
  .section h3{ font-size:14px; font-weight:700; margin:0 0 10px; padding-left:10px; border-left:4px solid var(--wood); }

  .item-legend-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .legend-entry{ display:flex; gap:8px; align-items:flex-start; background:var(--room-mid); border-radius:8px; padding:8px; }
  .legend-icon{ font-size:20px; flex-shrink:0; line-height:1.1; }
  .legend-text{ font-size:10.5px; line-height:1.45; color:var(--paper-dim); }
  .legend-text b{ color:var(--paper); font-size:11.5px; }

  .challenge-entry{ background:var(--room-mid); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .challenge-entry.done{ border:1px solid var(--spark-gold); }
  .challenge-desc{ font-size:12.5px; margin-bottom:6px; }
  .challenge-bar{ height:6px; background:var(--ink); border-radius:3px; overflow:hidden; }
  .challenge-bar-fill{ height:100%; background:linear-gradient(90deg, var(--spark-blue), var(--spark-gold)); border-radius:3px; transition:width .3s; }
  .challenge-progress{ font-size:10.5px; color:var(--paper-dim); margin-top:4px; text-align:right; }

  .skin-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .skin-swatch{ position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--room-mid); border-radius:10px; padding:10px 4px; border:2px solid transparent; }
  .skin-swatch.selected{ border-color:var(--spark-gold); }
  .skin-swatch.locked{ opacity:.45; }
  .swatch-dot{ width:26px; height:26px; border-radius:50%; background:var(--swatch-color); box-shadow:inset 0 -4px 0 rgba(0,0,0,.25); }
  .swatch-name{ font-size:10.5px; text-align:center; line-height:1.3; }
  .lock-icon{ position:absolute; top:4px; right:6px; font-size:11px; }

  #start-btn{
    flex-shrink:0; margin:10px 0 4px; padding:15px; border-radius:14px;
    background:var(--spark-gold); color:var(--ink); font-size:17px; font-weight:900;
    text-align:center; box-shadow:0 4px 0 #b8860a; letter-spacing:2px;
  }
  #start-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #b8860a; }

  /* ---------- GAME SCREEN ---------- */
  #game-screen{ touch-action:none; }

  #top-bar{ flex-shrink:0; display:flex; justify-content:space-around; align-items:center; padding:10px 6px; gap:4px; }
  .stat{ display:flex; flex-direction:column; align-items:center; min-width:0; }
  .stat .label{ font-size:9.5px; color:var(--paper-dim); margin-bottom:2px; }
  .stat .num{ font-size:16px; font-weight:700; white-space:nowrap; }
  #kwh-val{ color:var(--spark-gold); font-size:19px; }

  #stage{ position:relative; flex:1; min-height:0; margin:0 8px; border-radius:16px; overflow:hidden; background:linear-gradient(180deg, #2e2419 0%, #1c1511 100%); }
  #border-glow{ position:absolute; inset:0; pointer-events:none; z-index:5; border-radius:16px; }
  #stage.charging #border-glow{ box-shadow:inset 0 0 26px 8px rgba(82,214,242,.55); animation:chargePulse 1s infinite; }
  #stage.bonus #border-glow{ box-shadow:inset 0 0 40px 14px rgba(255,201,61,.8); animation:goldBorderPulse .45s infinite; }
  @keyframes chargePulse{ 0%,100%{ opacity:.6; } 50%{ opacity:1; } }
  @keyframes goldBorderPulse{ 0%,100%{ box-shadow:inset 0 0 30px 10px rgba(255,201,61,.7);} 50%{ box-shadow:inset 0 0 52px 20px rgba(255,225,120,1);} }

  #charge-label{ position:absolute; top:8px; left:50%; transform:translateX(-50%); font-size:10.5px; background:rgba(0,0,0,.45); padding:3px 10px; border-radius:10px; z-index:21; display:none; }

  #gauge-shell{ position:absolute; left:10px; top:14px; bottom:14px; width:36px; display:flex; flex-direction:column; align-items:center; z-index:20; }
  #gauge-level{ font-size:10px; margin-bottom:4px; color:var(--paper-dim); }
  #gauge-track{ position:relative; flex:1; width:20px; background:rgba(0,0,0,.4); border-radius:10px; border:2px solid rgba(255,255,255,.25); overflow:hidden; box-shadow:inset 0 2px 6px rgba(0,0,0,.6); }
  #gauge-fill{ position:absolute; left:0; right:0; bottom:0; height:0%; background:linear-gradient(to top, var(--spark-blue) 0%, var(--tatami) 45%, var(--spark-gold) 72%, var(--alert-red) 100%); transition:height .12s linear; }
  #gauge-danger-line{ position:absolute; left:-3px; right:-3px; bottom:70%; height:2px; background:repeating-linear-gradient(90deg, var(--alert-red) 0 4px, transparent 4px 8px); z-index:3; }
  #gauge-pct{ font-size:11px; margin-top:4px; }

  #item-slots{ position:absolute; right:10px; top:14px; display:flex; flex-direction:column; gap:9px; z-index:20; }
  .item-slot{ width:42px; height:42px; border-radius:9px; background:rgba(0,0,0,.35); box-shadow:inset 0 3px 6px rgba(0,0,0,.6), inset 0 -1px 0 rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; font-size:21px; }
  .item-slot.filled{ background:rgba(255,255,255,.08); cursor:pointer; animation:itemPopIn .3s; }
  @keyframes itemPopIn{ 0%{ transform:scale(0); } 70%{ transform:scale(1.25); } 100%{ transform:scale(1); } }

  #flying-basket{ position:absolute; top:16%; left:-15%; font-size:32px; z-index:25; display:none; cursor:pointer; }
  #flying-basket.flying{ display:block; animation-name:flyAcross; animation-timing-function:linear; animation-fill-mode:forwards; }
  @keyframes flyAcross{ from{ left:-15%; } to{ left:112%; } }

  #warning-mark{ position:absolute; top:4%; left:50%; transform:translateX(-50%); font-size:42px; font-weight:900; color:var(--alert-red); text-shadow:0 0 10px rgba(255,60,40,.8); display:none; z-index:30; }
  #warning-mark.show{ display:block; animation:warnPulse .3s infinite; }
  @keyframes warnPulse{ 0%,100%{ transform:translateX(-50%) scale(1); } 50%{ transform:translateX(-50%) scale(1.25); } }

  #bonus-banner{ position:absolute; top:38%; left:50%; transform:translate(-50%,-50%) scale(0.3); opacity:0; font-size:19px; font-weight:900; color:var(--spark-gold); text-shadow:0 0 6px rgba(0,0,0,.9), 0 0 16px var(--spark-gold); z-index:40; text-align:center; padding:0 20px; pointer-events:none; }
  #bonus-banner.show{ animation:bonusPop 1.5s ease-out forwards; }
  @keyframes bonusPop{ 0%{ transform:translate(-50%,-50%) scale(0.3); opacity:0; } 20%{ transform:translate(-50%,-50%) scale(1.1); opacity:1; } 35%{ transform:translate(-50%,-50%) scale(1); opacity:1; } 80%{ opacity:1; } 100%{ opacity:0; transform:translate(-50%,-50%) scale(1); } }

  #oyaji-wrap{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:16% 20%; }
  #oyaji-svg{ width:100%; height:100%; overflow:visible; }

  .robe-body{ fill:var(--robe-color); }
  .robe-collar{ stroke:var(--ink); stroke-width:3; stroke-linecap:round; }
  .table-top,.table-leg{ fill:var(--wood); }
  .teacup{ fill:#e8e4d0; stroke:#b0a888; stroke-width:1.5; }
  .newspaper{ fill:#f2ecd6; stroke:#c9c2a4; stroke-width:1.5; }
  .paper-line{ stroke:#c9c2a4; stroke-width:2; }
  .head,.ear{ fill:var(--skin-tone); }
  .hair-base{ fill:#a8a8a8; }
  .hair-spikes polygon{ fill:#a8a8a8; }
  .brow{ stroke:#4a3a2e; stroke-width:5; stroke-linecap:round; transition:transform .25s; }
  .brow-l{ transform-origin:105px 79px; }
  .brow-r{ transform-origin:135px 79px; }
  .eye{ stroke:var(--ink); stroke-width:3; fill:none; stroke-linecap:round; }
  .eye-angry{ stroke:var(--ink); stroke-width:3; stroke-linecap:round; }
  .mouth-neutral,.mouth-frown{ stroke:#5a3d2b; stroke-width:3.5; fill:none; stroke-linecap:round; }
  .mouth-shout{ fill:#7a3325; }
  .vein{ fill:none; stroke:var(--spark-blue); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .spark{ fill:none; stroke:var(--spark-blue); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
  .plasma-aura{ fill:var(--spark-violet); }
  .hachimaki{ fill:none; stroke:#c62828; stroke-width:9; stroke-linecap:round; }

  #oyaji-wrap .plasma-aura{ opacity:0; transition:opacity .3s; }
  #oyaji-wrap .hair-spikes{ opacity:0; transition:opacity .3s; }
  #oyaji-wrap .vein{ opacity:0; transition:opacity .3s; }
  #oyaji-wrap .eyes-angry{ opacity:0; }
  #oyaji-wrap .eyes-calm{ opacity:1; }
  #oyaji-wrap .mouth-frown,#oyaji-wrap .mouth-shout{ opacity:0; }
  #oyaji-wrap .mouth-neutral{ opacity:1; }
  #oyaji-wrap .sparks-mid,#oyaji-wrap .sparks-high{ opacity:0; }
  #oyaji-wrap .sparks-low{ opacity:.45; animation:sparkFlicker 1.6s infinite; }
  #oyaji-wrap .newspaper-group{ opacity:1; transform:none; transition:opacity .25s, transform .25s; }
  #oyaji-wrap .hachimaki{ opacity:0; transition:opacity .2s; }
  #oyaji-wrap.has-hachimaki .hachimaki{ opacity:1; }
  #oyaji-wrap .table-group{ transform-origin:120px 220px; }

  @keyframes sparkFlicker{ 0%,100%{ opacity:.3; } 50%{ opacity:1; } }
  @keyframes plasmaPulse{ 0%,100%{ opacity:.55; transform:scale(1); } 50%{ opacity:.85; transform:scale(1.06); } }
  @keyframes legShakeSlow{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-2px); } 75%{ transform:translateX(2px); } }
  @keyframes legShakeFast{ 0%,100%{ transform:translateX(0) rotate(0deg); } 25%{ transform:translateX(-3px) rotate(-0.6deg); } 75%{ transform:translateX(3px) rotate(0.6deg); } }
  @keyframes bonusShake{ 0%,100%{ transform:scale(1) rotate(0deg); } 25%{ transform:scale(1.02) rotate(-0.8deg); } 75%{ transform:scale(1.02) rotate(0.8deg); } }

  #oyaji-wrap[data-state="irritated"] .vein{ opacity:1; animation:sparkFlicker 1s infinite; }
  #oyaji-wrap[data-state="irritated"] .sparks-mid{ opacity:.85; animation:sparkFlicker .9s infinite; }
  #oyaji-wrap[data-state="irritated"] .brow-l{ transform:rotate(-14deg); }
  #oyaji-wrap[data-state="irritated"] .brow-r{ transform:rotate(14deg); }
  #oyaji-wrap[data-state="irritated"] .newspaper-group{ transform:translateY(6px) rotate(-5deg); }
  #oyaji-wrap[data-state="irritated"] .mouth-neutral{ opacity:0; }
  #oyaji-wrap[data-state="irritated"] .mouth-frown{ opacity:1; }
  #oyaji-wrap[data-state="irritated"] .robe-body{ animation:legShakeSlow .35s infinite; }

  #oyaji-wrap[data-state="critical"] .plasma-aura{ opacity:.65; animation:plasmaPulse .9s infinite; }
  #oyaji-wrap[data-state="critical"] .hair-spikes{ opacity:1; }
  #oyaji-wrap[data-state="critical"] .vein{ opacity:1; animation:sparkFlicker .5s infinite; }
  #oyaji-wrap[data-state="critical"] .eyes-calm{ opacity:0; }
  #oyaji-wrap[data-state="critical"] .eyes-angry{ opacity:1; }
  #oyaji-wrap[data-state="critical"] .mouth-neutral,#oyaji-wrap[data-state="critical"] .mouth-frown{ opacity:0; }
  #oyaji-wrap[data-state="critical"] .mouth-shout{ opacity:1; }
  #oyaji-wrap[data-state="critical"] .sparks-mid{ opacity:1; }
  #oyaji-wrap[data-state="critical"] .sparks-high{ opacity:1; animation:sparkFlicker .3s infinite; }
  #oyaji-wrap[data-state="critical"] .newspaper-group{ opacity:0; }
  #oyaji-wrap[data-state="critical"] .brow-l{ transform:rotate(-24deg); }
  #oyaji-wrap[data-state="critical"] .brow-r{ transform:rotate(24deg); }
  #oyaji-wrap[data-state="critical"] .robe-body{ animation:legShakeFast .15s infinite; }
  #oyaji-wrap[data-state="critical"] .spark{ stroke:var(--spark-violet); }

  #oyaji-wrap[data-state="bonus"] .plasma-aura{ opacity:.9; fill:var(--spark-gold); animation:plasmaPulse .35s infinite; }
  #oyaji-wrap[data-state="bonus"] .hair-spikes{ opacity:1; }
  #oyaji-wrap[data-state="bonus"] .vein{ opacity:1; animation:sparkFlicker .25s infinite; }
  #oyaji-wrap[data-state="bonus"] .eyes-calm{ opacity:0; }
  #oyaji-wrap[data-state="bonus"] .eyes-angry{ opacity:1; }
  #oyaji-wrap[data-state="bonus"] .mouth-neutral,#oyaji-wrap[data-state="bonus"] .mouth-frown{ opacity:0; }
  #oyaji-wrap[data-state="bonus"] .mouth-shout{ opacity:1; }
  #oyaji-wrap[data-state="bonus"] .sparks-mid,#oyaji-wrap[data-state="bonus"] .sparks-high{ opacity:1; animation:sparkFlicker .12s infinite; }
  #oyaji-wrap[data-state="bonus"] .newspaper-group{ opacity:0; }
  #oyaji-wrap[data-state="bonus"] .spark{ stroke:var(--spark-gold); }
  #oyaji-wrap[data-state="bonus"]{ animation:bonusShake .25s infinite; }

  #oyaji-wrap[data-state="dead"] .mouth-shout{ opacity:1; }
  #oyaji-wrap[data-state="dead"] .mouth-neutral,#oyaji-wrap[data-state="dead"] .mouth-frown{ opacity:0; }
  #oyaji-wrap[data-state="dead"] .eyes-angry{ opacity:1; }
  #oyaji-wrap[data-state="dead"] .eyes-calm{ opacity:0; }
  #oyaji-wrap[data-state="dead"] .table-group{ animation:tableFlip 1.1s ease-in forwards; }
  #oyaji-wrap[data-state="dead"] .newspaper-group{ animation:paperFly 1.1s ease-in forwards; }
  @keyframes tableFlip{ 0%{ transform:rotate(0) translate(0,0); opacity:1; } 100%{ transform:rotate(-110deg) translate(-50px,-170px); opacity:0; } }
  @keyframes paperFly{ 0%{ transform:translate(0,0) rotate(0); opacity:1; } 100%{ transform:translate(60px,-90px) rotate(80deg); opacity:0; } }

  #death-flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:50; }
  #death-flash.flash{ animation:screenFlash .6s ease-out; }
  @keyframes screenFlash{ 0%{ opacity:0; } 12%{ opacity:1; } 100%{ opacity:0; } }

  #big-bolt{ position:absolute; top:-8%; left:50%; width:50%; height:118%; transform:translateX(-50%); z-index:45; opacity:0; pointer-events:none; }
  #big-bolt polygon{ fill:var(--spark-gold); stroke:#fff; stroke-width:1.5; stroke-linejoin:round; }
  #big-bolt.strike{ animation:bigBolt .65s ease-out; }
  @keyframes bigBolt{ 0%{ opacity:0; transform:translateX(-50%) scaleY(.3); } 18%{ opacity:1; transform:translateX(-50%) scaleY(1); } 55%{ opacity:1; } 100%{ opacity:0; } }

  #death-shout{ position:absolute; top:48%; left:50%; transform:translate(-50%,-50%) scale(0.5); opacity:0; font-size:22px; font-weight:900; color:#fff; text-shadow:2px 2px 0 var(--alert-red), -2px -2px 0 var(--alert-red); z-index:55; text-align:center; white-space:nowrap; }
  #death-shout.show{ animation:shoutPop 1s ease-out forwards; }
  @keyframes shoutPop{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(0.3) rotate(-6deg); } 30%{ opacity:1; transform:translate(-50%,-50%) scale(1.15) rotate(3deg); } 60%{ transform:translate(-50%,-50%) scale(1) rotate(0); } 100%{ opacity:0; transform:translate(-50%,-50%) scale(1); } }

  .float-text{ position:absolute; left:50%; top:38%; transform:translate(-50%,-50%); font-weight:900; font-size:15px; color:var(--spark-gold); text-shadow:0 0 4px rgba(0,0,0,.9); pointer-events:none; z-index:35; animation:floatUp .8s ease-out forwards; }
  @keyframes floatUp{ 0%{ opacity:1; transform:translate(-50%,-50%) translateY(0); } 100%{ opacity:0; transform:translate(-50%,-50%) translateY(-46px); } }

  #toast-container{ position:absolute; bottom:10px; left:50%; transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:4px; align-items:center; pointer-events:none; width:90%; }
  .toast{ background:rgba(0,0,0,.78); color:#fff; padding:5px 14px; border-radius:14px; font-size:11.5px; animation:toastSlide 2s ease forwards; white-space:nowrap; }
  @keyframes toastSlide{ 0%{ opacity:0; transform:translateY(10px); } 10%{ opacity:1; transform:translateY(0); } 85%{ opacity:1; } 100%{ opacity:0; transform:translateY(-8px); } }

  /* Item slot use hint */
  #item-slots .item-slot.filled::after{ content:''; }

  #command-bar{ flex-shrink:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:8px; padding:10px 8px; height:148px; }
  .cmd-btn{ position:relative; border-radius:13px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; overflow:hidden; box-shadow:0 3px 0 var(--wood-deep); background:var(--wood); }
  .cmd-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--wood-deep); }
  .cmd-btn .cmd-name{ font-size:13.5px; font-weight:700; z-index:2; }
  .cmd-btn .cmd-info{ font-size:10px; opacity:.85; z-index:2; }
  .cmd-btn .cd-overlay{ position:absolute; left:0; right:0; bottom:0; height:0%; background:rgba(0,0,0,.55); pointer-events:none; z-index:1; }
  .cmd-btn.on-cooldown .cmd-name,.cmd-btn.on-cooldown .cmd-info{ opacity:.65; }
  .cmd-btn[data-cmd="snack"]{ background:#b5622a; box-shadow:0 3px 0 #7c4218; }
  .cmd-btn[data-cmd="snack"]:active{ box-shadow:0 1px 0 #7c4218; }
  .cmd-btn[data-cmd="bonsai"]{ background:#7a4a8a; box-shadow:0 3px 0 #4f2f5c; }
  .cmd-btn[data-cmd="bonsai"]:active{ box-shadow:0 1px 0 #4f2f5c; }
  .cmd-btn[data-cmd="tea"]{ background:#5c8a52; box-shadow:0 3px 0 #3a5c33; }
  .cmd-btn[data-cmd="tea"]:active{ box-shadow:0 1px 0 #3a5c33; }
  .cmd-btn.urgent{ outline:3px solid var(--alert-red); animation:warnPulse .3s infinite; }

  /* ---------- RESULT SCREEN ---------- */
  #result-screen{ align-items:center; justify-content:center; padding:20px; text-align:center; }
  #result-title-badge{ font-size:20px; font-weight:900; padding:10px 22px; border-radius:30px; background:var(--room-mid); border:2px solid var(--paper-dim); margin-bottom:18px; }
  #result-title-badge[data-tier="1"]{ border-color:#9e9e9e; }
  #result-title-badge[data-tier="2"]{ border-color:var(--spark-blue); color:var(--spark-blue); }
  #result-title-badge[data-tier="3"]{ border-color:var(--spark-gold); color:var(--spark-gold); }
  #result-title-badge[data-tier="4"]{ border-color:var(--spark-violet); color:#fff; background:linear-gradient(120deg, var(--spark-violet), var(--spark-gold)); box-shadow:0 0 22px rgba(157,109,255,.6); }
  #result-kwh{ font-size:34px; font-weight:900; color:var(--spark-gold); margin:0 0 6px; }
  #result-time{ font-size:13px; color:var(--paper-dim); margin:0 0 16px; }
  #result-newrecord{ font-size:14px; font-weight:700; color:var(--spark-gold); margin-bottom:14px; }
  #result-unlocks{ margin-bottom:10px; }
  .unlock-item{ background:var(--room-mid); border:1px solid var(--spark-gold); border-radius:10px; padding:8px 14px; font-size:12.5px; margin-bottom:8px; }
  #retry-btn{ margin-top:10px; padding:15px 40px; border-radius:14px; background:var(--spark-gold); color:var(--ink); font-size:16px; font-weight:900; box-shadow:0 4px 0 #b8860a; letter-spacing:2px; }
  #retry-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #b8860a; }
</style>
</head>
<body>
<div id="app">

  <div id="start-screen" class="screen">
    <div class="start-scroll">
      <div class="title-block">
        <svg class="title-bolt" viewBox="0 0 24 24"><path d="M13 1 L4 14 L11 14 L9 23 L20 9 L12 9 Z"/></svg>

          <g class="sparks sparks-high">

            <polyline points="190,56 198,72 190,73 200,90" class="spark"/>

      <div id="death-flash"></div>
      <svg id="big-bolt" viewBox="0 0 100 200"><polygon points="52,0 30,82 55,82 18,200 72,92 46,92 68,0"/></svg>

    <div id="command-bar">

  <div id="result-screen" class="screen hidden">

    <div id="result-kwh" class="num">0 kWh</div>

    <div id="result-newrecord" class="hidden">🎉 ベストスコア更新！</div>
    <div id="result-unlocks"></div>
    <button id="retry-btn">もう一度プレイ</button>
  </div>

</div>

<script>
(function(){
  'use strict';

  /* ================= CONSTANTS ================= */
  var COOLDOWN = { homework:0.5, snack:1.2, bonsai:3.0, tea:5.0 };
  var ANGER_DELTA = { homework:5, snack:15, bonsai:35, tea:-25 };
  var KWH_BASE = { homework:10, snack:40, bonsai:120, tea:0 };
  var BASE_DECAY = 4;
  var LEVEL_INTERVAL = 10;
  var SURPRISE_MIN_LEVEL = 3;
  var SURPRISE_MIN = 15, SURPRISE_MAX = 30;
  var SURPRISE_WINDOW = 2;
  var SURPRISE_PENALTY = 30;
  var BONUS_GAUGE_THRESHOLD = 80;
  var BONUS_CHARGE_NEEDED = 8;
  var BONUS_DURATION = 7;
  var BONUS_KWH_MULT = 10;
  var BONUS_RESET_GAUGE = 30;
  var MAX_ITEM_SLOTS = 2;
  var MILESTONE_STEP = 1000;
  var BASKET_MIN = 14, BASKET_MAX = 24;
  var BASKET_FLIGHT_TIME = 4;

  var ITEM_TYPES = ['sake','earth','chabudai','momvoice'];
  var ITEM_INFO = {
    sake:{ name:'プレミアム冷酒', desc:'怒りを即座に半減し、3秒間冷却速度2倍', icon:'🍶' },
    earth:{ name:'アース線', desc:'30秒間、怒り100%到達を1度だけ無効化', icon:'⚡' },
    chabudai:{ name:'頑丈なちゃぶ台', desc:'10秒間、発電量が2倍になる', icon:'🪵' },
    momvoice:{ name:'母ちゃんの怒声', desc:'5秒間、コマンドの怒り上昇がゼロに', icon:'📣' }
  };

  var TITLES = [
    { min:0, max:500, name:'豆電球レベル' },
    { min:501, max:2000, name:'一般家庭の1日分' },
    { min:2001, max:10000, name:'町内会の救世主' },
    { min:10001, max:Infinity, name:'歩く原子力発電所' }
  ];

  var SKINS = {
    default:{ name:'普段着', robeColor:'#5c6b73' },
    yukata:{ name:'浴衣', robeColor:'#3f8fbf' },
    suteteko:{ name:'ステテコ姿', robeColor:'#e8dfc4' },
    golden:{ name:'金ピカ勝負服', robeColor:'#e0a520' },
    hachimaki:{ name:'気合の鉢巻き', robeColor:'#7a5a45' }
  };

  var CHALLENGE_POOL = [
    { id:'highvoltage30', desc:'高圧域(70%以上)を合計30秒キープ', target:30, unit:'秒', track:'highVoltageTime' },
    { id:'bonsai3000', desc:'盆栽いじりで累計3,000kWh稼ぐ', target:3000, unit:'kWh', track:'bonsaiKwh' },
    { id:'bonustime3', desc:'超伝導サンダーモードを3回発動', target:3, unit:'回', track:'bonusCount' },
    { id:'nogameover5min', desc:'1プレイで5分間生存する', target:300, unit:'秒', track:'maxSurviveTime', maxType:true }
  ];
  var CHALLENGE_TO_SKIN = { highvoltage30:'yukata', bonsai3000:'suteteko', bonustime3:'golden', nogameover5min:'hachimaki' };

  /* ================= DOM REFS ================= */
  var screens = {
    start: document.getElementById('start-screen'),
    game: document.getElementById('game-screen'),
    result: document.getElementById('result-screen')
  };
  var bestScoreDisplay = document.getElementById('best-score-display');
  var itemLegendEl = document.getElementById('item-legend');
  var dailyChallengeListEl = document.getElementById('daily-challenge-list');
  var skinSelectorEl = document.getElementById('skin-selector');
  var startBtn = document.getElementById('start-btn');
  var retryBtn = document.getElementById('retry-btn');

  var kwhVal = document.getElementById('kwh-val');
  var multVal = document.getElementById('mult-val');
  var timeVal = document.getElementById('time-val');

  var stageEl = document.getElementById('stage');
  var chargeLabel = document.getElementById('charge-label');
  var gaugeFill = document.getElementById('gauge-fill');
  var gaugePct = document.getElementById('gauge-pct');
  var gaugeLevel = document.getElementById('gauge-level');
  var itemSlotEls = Array.prototype.slice.call(document.querySelectorAll('.item-slot'));
  var flyingBasketEl = document.getElementById('flying-basket');
  var warningMarkEl = document.getElementById('warning-mark');
  var bonusBannerEl = document.getElementById('bonus-banner');
  var oyajiWrap = document.getElementById('oyaji-wrap');
  var deathFlash = document.getElementById('death-flash');
  var bigBolt = document.getElementById('big-bolt');
  var deathShout = document.getElementById('death-shout');
  var toastContainer = document.getElementById('toast-container');

  var resultTitleBadge = document.getElementById('result-title-badge');
  var resultKwh = document.getElementById('result-kwh');
  var resultTime = document.getElementById('result-time');
  var resultNewRecord = document.getElementById('result-newrecord');
  var resultUnlocks = document.getElementById('result-unlocks');

  var cmdButtons = {};
  Array.prototype.forEach.call(document.querySelectorAll('.cmd-btn'), function(btn){
    cmdButtons[btn.getAttribute('data-cmd')] = btn;
  });

  /* ================= UTIL ================= */
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
  function rand(min,max){ return Math.random()*(max-min)+min; }
  function formatTime(sec){
    var m = Math.floor(sec/60);
    var s = Math.floor(sec%60);
    return m + ':' + (s<10?'0':'') + s;
  }
  function voltageMultiplier(gauge){ return 1 + (gauge/100)*4; }
  function todayStr(){ return new Date().toDateString(); }

  /* ================= STORAGE ================= */
  async function storageGetJSON(key){
    try{
      var r = await window.storage.get(key);
      if (r && r.value) return JSON.parse(r.value);
      return null;
    } catch(e){
      return null;
    }
  }
  async function storageSetJSON(key, obj){
    try{ await window.storage.set(key, JSON.stringify(obj)); } catch(e){ /* ignore */ }
  }

  function pickChallengesForDate(dateStr){
    var h = 0;
    for (var i=0;i<dateStr.length;i++){ h = (h*31 + dateStr.charCodeAt(i)) >>> 0; }
    var idx1 = h % CHALLENGE_POOL.length;
    var idx2 = Math.floor(h/7) % CHALLENGE_POOL.length;
    if (idx2 === idx1) idx2 = (idx2+1) % CHALLENGE_POOL.length;
    return [CHALLENGE_POOL[idx1], CHALLENGE_POOL[idx2]];
  }

  async function loadDailyRecord(){
    var rec = await storageGetJSON('dailyChallenge');
    var today = todayStr();
    if (!rec || rec.date !== today){
      var chosen = pickChallengesForDate(today);
      rec = { date: today, ids: [chosen[0].id, chosen[1].id], progress:{}, completed:[] };
      rec.progress[chosen[0].id] = 0;
      rec.progress[chosen[1].id] = 0;
    }
    return rec;
  }

  async function loadUnlockedSkins(){
    var arr = await storageGetJSON('unlockedSkins');
    return arr || [];
  }

  async function updateDailyProgress(sessionContrib){
    var rec = await loadDailyRecord();
    var newlyCompleted = [];
    for (var i=0;i<rec.ids.length;i++){
      var id = rec.ids[i];
      if (rec.completed.indexOf(id) !== -1) continue;
      var def = null;
      for (var j=0;j<CHALLENGE_POOL.length;j++){ if (CHALLENGE_POOL[j].id===id){ def = CHALLENGE_POOL[j]; break; } }
      if (!def) continue;
      var val = sessionContrib[def.track] || 0;
      if (def.maxType){
        rec.progress[id] = Math.max(rec.progress[id]||0, val);
      } else {
        rec.progress[id] = (rec.progress[id]||0) + val;
      }
      if (rec.progress[id] >= def.target){
        rec.completed.push(id);
        newlyCompleted.push(id);
      }
    }
    await storageSetJSON('dailyChallenge', rec);

    if (newlyCompleted.length){
      var skins = await loadUnlockedSkins();
      newlyCompleted.forEach(function(id){
        var skinId = CHALLENGE_TO_SKIN[id];
        if (skinId && skins.indexOf(skinId) === -1) skins.push(skinId);
      });
      await storageSetJSON('unlockedSkins', skins);
    }
    dailyRecord = rec;
    return newlyCompleted;
  }

  /* ================= META STATE ================= */
  var unlockedSkins = [];
  var selectedSkin = 'default';
  var dailyRecord = null;

  async function initMeta(){
    var hs = await storageGetJSON('highscore');
    if (hs && typeof hs.kwh === 'number'){
      bestScoreDisplay.textContent = hs.kwh.toLocaleString('ja-JP') + ' kWh (' + hs.title + ')';
    } else {
      bestScoreDisplay.textContent = 'まだ記録がありません';
    }

    unlockedSkins = await loadUnlockedSkins();
    if (unlockedSkins.indexOf(selectedSkin) === -1 && selectedSkin !== 'default') selectedSkin = 'default';

    dailyRecord = await loadDailyRecord();
    await storageSetJSON('dailyChallenge', dailyRecord);

    renderItemLegend();
    renderSkinSelector();
    renderDailyChallenges();
  }

  function renderItemLegend(){
    itemLegendEl.innerHTML = ITEM_TYPES.map(function(t){
      var info = ITEM_INFO[t];
      return '<div class="legend-entry"><span class="legend-icon">'+info.icon+'</span>' +
        '<span class="legend-text"><b>'+info.name+'</b><br>'+info.desc+'</span></div>';
    }).join('');
  }

  function renderSkinSelector(){
    skinSelectorEl.innerHTML = '';
    Object.keys(SKINS).forEach(function(id){
      var skin = SKINS[id];
      var unlocked = (id === 'default') || (unlockedSkins.indexOf(id) !== -1);
      var div = document.createElement('button');
      div.className = 'skin-swatch' + (unlocked ? '' : ' locked') + (id===selectedSkin ? ' selected' : '');
      div.style.setProperty('--swatch-color', skin.robeColor);
      div.innerHTML = '<span class="swatch-dot"></span><span class="swatch-name">'+skin.name+'</span>' + (unlocked ? '' : '<span class="lock-icon">🔒</span>');
      if (unlocked){
        div.addEventListener('click', function(){ selectedSkin = id; renderSkinSelector(); });
      }
      skinSelectorEl.appendChild(div);
    });
  }

  function renderDailyChallenges(){
    if (!dailyRecord){ dailyChallengeListEl.innerHTML=''; return; }
    dailyChallengeListEl.innerHTML = dailyRecord.ids.map(function(id){
      var def = null;
      for (var j=0;j<CHALLENGE_POOL.length;j++){ if (CHALLENGE_POOL[j].id===id){ def = CHALLENGE_POOL[j]; break; } }
      if (!def) return '';
      var prog = Math.min(def.target, dailyRecord.progress[id]||0);
      var done = dailyRecord.completed.indexOf(id) !== -1;
      var pct = Math.min(100, (prog/def.target)*100);
      var progDisplay = def.track==='bonsaiKwh' ? Math.floor(prog).toLocaleString('ja-JP') : Math.floor(prog);
      return '<div class="challenge-entry'+(done?' done':'')+'">' +
        '<div class="challenge-desc">'+(done?'✅ ':'')+def.desc+'</div>' +
        '<div class="challenge-bar"><div class="challenge-bar-fill" style="width:'+pct+'%"></div></div>' +
        '<div class="challenge-progress">'+progDisplay+' / '+def.target+def.unit+'</div>' +
        '</div>';
    }).join('');
  }

  function applySkin(skinId){
    var skin = SKINS[skinId] || SKINS.default;
    document.documentElement.style.setProperty('--robe-color', skin.robeColor);
    oyajiWrap.classList.toggle('has-hachimaki', skinId === 'hachimaki');
  }

  /* ================= GAME STATE ================= */
  var state = null;

  function resetState(){
    state = {
      running:false,
      gaugeAnger:0,
      kwh:0,
      elapsed:0,
      level:1,
      cooldowns:{ homework:0, snack:0, bonsai:0, tea:0 },
      items:[null,null],
      chargeMeter:0,
      bonusActive:false,
      bonusTimeLeft:0,
      surpriseActive:false,
      surpriseTimer:0,
      nextSurpriseAt:null,
      buffs:{ sakeDecayUntil:0, chabudaiUntil:0, momvoiceUntil:0, earthShieldUntil:0 },
      nextMilestone: MILESTONE_STEP,
      nextBasketAt: rand(BASKET_MIN, BASKET_MAX),
      basketFlying:false,
      sessionHighVoltageTime:0,
      sessionBonsaiKwh:0,
      sessionBonusCount:0
    };
  }
  resetState();

  function showScreen(name){
    Object.keys(screens).forEach(function(n){
      screens[n].classList.toggle('hidden', n !== name);
    });
  }

  /* ================= COMMAND LOGIC ================= */
  function performCommand(cmd){
    if (!state.running) return;
    if (!state.bonusActive && state.cooldowns[cmd] > 0) return;

    if (!state.bonusActive) state.cooldowns[cmd] = COOLDOWN[cmd];

    var delta = ANGER_DELTA[cmd];
    if (cmd === 'tea'){
      if (state.surpriseActive){
        state.surpriseActive = false;
        showToast('お茶で不意打ちを回避！');
        scheduleSurprise();
      }
    } else {
      var angerMult = 1 + 0.05*state.level;
      delta = delta * angerMult;
      if (state.elapsed < state.buffs.momvoiceUntil) delta = 0;
    }

    state.gaugeAnger = clamp(state.gaugeAnger + delta, 0, 100);

    var mult = state.bonusActive ? BONUS_KWH_MULT : voltageMultiplier(state.gaugeAnger);
    var chabudaiMult = (state.elapsed < state.buffs.chabudaiUntil) ? 2 : 1;
    var gained = KWH_BASE[cmd] * mult * chabudaiMult;
    state.kwh += gained;
    if (cmd === 'bonsai') state.sessionBonsaiKwh += gained;

    if (gained > 0) spawnFloatingText(gained);

    checkMilestone();
    if (!checkGameOver()) render();
  }

  function spawnFloatingText(gained){
    var el = document.createElement('div');
    el.className = 'float-text';
    var offsetX = Math.round(rand(-30,30));
    el.style.left = 'calc(50% + ' + offsetX + 'px)';
    el.textContent = '+' + Math.round(gained) + 'kWh';
    stageEl.appendChild(el);
    setTimeout(function(){ el.remove(); }, 800);
  }

  function showToast(msg){
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    toastContainer.appendChild(el);
    setTimeout(function(){ el.remove(); }, 2000);
  }

  function checkMilestone(){
    while (state.kwh >= state.nextMilestone){
      var got = grantRandomItem();
      if (got) showToast('🎁 ' + Math.round(state.nextMilestone).toLocaleString('ja-JP') + 'kWh達成でアイテム獲得！');
      state.nextMilestone += MILESTONE_STEP;
    }
  }

  function checkGameOver(){
    if (!state.running) return true;
    if (state.bonusActive) return false;
    if (state.gaugeAnger >= 100){
      if (state.elapsed < state.buffs.earthShieldUntil){
        state.buffs.earthShieldUntil = 0;
        state.gaugeAnger = 0;
        showToast('⚡ アース線発動！九死に一生を得た！');
        render();
        return false;
      }
      triggerGameOver();
      return true;
    }
    return false;
  }

  /* ================= ITEMS ================= */
  function grantRandomItem(){
    var emptyIndex = state.items.indexOf(null);
    if (emptyIndex === -1) return false;
    var type = ITEM_TYPES[Math.floor(Math.random()*ITEM_TYPES.length)];
    state.items[emptyIndex] = type;
    renderItemSlots();
    return true;
  }

  function useItem(slotIndex){
    if (!state.running) return;
    var type = state.items[slotIndex];
    if (!type) return;
    state.items[slotIndex] = null;
    applyItemEffect(type);
    renderItemSlots();
  }

  function applyItemEffect(type){
    var now = state.elapsed;
    if (type === 'sake'){
      state.gaugeAnger = state.gaugeAnger * 0.5;
      state.buffs.sakeDecayUntil = now + 3;
    } else if (type === 'earth'){
      state.buffs.earthShieldUntil = now + 30;
    } else if (type === 'chabudai'){
      state.buffs.chabudaiUntil = now + 10;
    } else if (type === 'momvoice'){
      state.buffs.momvoiceUntil = now + 5;
    }
    showToast(ITEM_INFO[type].name + ' 使用！');
    render();
  }

  function renderItemSlots(){
    itemSlotEls.forEach(function(el, i){
      var type = state.items[i];
      if (type){
        el.classList.add('filled');
        el.textContent = ITEM_INFO[type].icon;
        el.title = ITEM_INFO[type].name;
      } else {
        el.classList.remove('filled');
        el.textContent = '';
        el.removeAttribute('title');
      }
    });
  }

  /* ================= BASKET ================= */
  function updateBasketTiming(dt){
    if (state.basketFlying) return;
    state.nextBasketAt -= dt;
    if (state.nextBasketAt <= 0){
      if (state.items.indexOf(null) !== -1) spawnBasket();
      state.nextBasketAt = rand(BASKET_MIN, BASKET_MAX);
    }
  }
  function spawnBasket(){
    state.basketFlying = true;
    flyingBasketEl.style.animationDuration = BASKET_FLIGHT_TIME + 's';
    flyingBasketEl.style.top = rand(10,30) + '%';
    flyingBasketEl.classList.add('flying');
  }
  function catchBasket(){
    if (!state.basketFlying) return;
    state.basketFlying = false;
    flyingBasketEl.classList.remove('flying');
    var got = grantRandomItem();
    if (got) showToast('🧺 アイテムゲット！');
  }
  function missBasket(){
    if (!state.basketFlying) return;
    state.basketFlying = false;
    flyingBasketEl.classList.remove('flying');
  }

  /* ================= SURPRISE ATTACK ================= */
  function scheduleSurprise(){
    state.nextSurpriseAt = state.elapsed + rand(SURPRISE_MIN, SURPRISE_MAX);
  }

  /* ================= BONUS MODE ================= */
  function startBonus(){
    state.bonusActive = true;
    state.bonusTimeLeft = BONUS_DURATION;
    state.chargeMeter = 0;
    state.sessionBonusCount++;
    Object.keys(state.cooldowns).forEach(function(k){ state.cooldowns[k] = 0; });
    bonusBannerEl.classList.remove('show');
    void bonusBannerEl.offsetWidth;
    bonusBannerEl.classList.add('show');
  }
  function endBonus(){
    state.bonusActive = false;
    state.gaugeAnger = BONUS_RESET_GAUGE;
  }

  /* ================= GAME OVER SEQUENCE ================= */
  function triggerGameOver(){
    state.running = false;
    playDeathSequence(function(){
      finalizeResults();
    });
  }

  function playDeathSequence(cb){
    oyajiWrap.dataset.state = 'dead';
    warningMarkEl.classList.remove('show');
    deathFlash.classList.remove('flash');
    void deathFlash.offsetWidth;
    deathFlash.classList.add('flash');
    bigBolt.classList.remove('strike');
    void bigBolt.offsetWidth;
    bigBolt.classList.add('strike');
    deathShout.classList.remove('show');
    void deathShout.offsetWidth;
    deathShout.classList.add('show');
    setTimeout(function(){
      cb();
    }, 1500);
  }

  function getTitleFor(kwh){
    for (var i=0;i<TITLES.length;i++){
      if (kwh >= TITLES[i].min && kwh <= TITLES[i].max) return TITLES[i];
    }
    return TITLES[TITLES.length-1];
  }

  async function finalizeResults(){
    var finalKwh = Math.floor(state.kwh);
    var titleInfo = getTitleFor(finalKwh);

    var newlyCompleted = await updateDailyProgress({
      highVoltageTime: state.sessionHighVoltageTime,
      bonsaiKwh: state.sessionBonsaiKwh,
      bonusCount: state.sessionBonusCount,
      maxSurviveTime: state.elapsed
    });

    var isRecord = false;
    var prevBest = 0;
    var hs = await storageGetJSON('highscore');
    if (hs && typeof hs.kwh === 'number') prevBest = hs.kwh;
    if (finalKwh > prevBest){
      isRecord = true;
      await storageSetJSON('highscore', { kwh: finalKwh, title: titleInfo.name, date: new Date().toISOString() });
    }

    if (newlyCompleted.length){
      unlockedSkins = await loadUnlockedSkins();
    }

    renderResultScreen(finalKwh, titleInfo, isRecord, state.elapsed, newlyCompleted);
    showScreen('result');
  }

  function renderResultScreen(kwh, titleInfo, isRecord, elapsed, newlyCompleted){
    resultTitleBadge.textContent = titleInfo.name;
    resultTitleBadge.setAttribute('data-tier', String(TITLES.indexOf(titleInfo)+1));
    resultKwh.textContent = kwh.toLocaleString('ja-JP') + ' kWh';
    resultTime.textContent = '生存時間: ' + formatTime(elapsed);
    resultNewRecord.classList.toggle('hidden', !isRecord);

    resultUnlocks.innerHTML = '';
    newlyCompleted.forEach(function(id){
      var skinId = CHALLENGE_TO_SKIN[id];
      var skin = SKINS[skinId];
      if (!skin) return;
      var div = document.createElement('div');
      div.className = 'unlock-item';
      div.textContent = '🎉 新しい衣装「' + skin.name + '」を解放！';
      resultUnlocks.appendChild(div);
    });
  }

  /* ================= CHARACTER STATE ================= */
  function characterVisualState(){
    if (state.bonusActive) return 'bonus';
    var g = state.gaugeAnger;
    if (g <= 40) return 'normal';
    if (g <= 69) return 'irritated';
    return 'critical';
  }

  /* ================= RENDER ================= */
  function renderCooldowns(){
    Object.keys(cmdButtons).forEach(function(cmd){
      var btn = cmdButtons[cmd];
      var ratio = state.cooldowns[cmd] / COOLDOWN[cmd];
      var overlay = btn.querySelector('.cd-overlay');
      overlay.style.height = Math.max(0, ratio*100) + '%';
      btn.classList.toggle('on-cooldown', state.cooldowns[cmd] > 0.001);
    });
    if (cmdButtons.tea) cmdButtons.tea.classList.toggle('urgent', state.surpriseActive);
  }

  function render(){
    kwhVal.textContent = Math.floor(state.kwh).toLocaleString('ja-JP');
    var mult = state.bonusActive ? BONUS_KWH_MULT : voltageMultiplier(state.gaugeAnger);
    multVal.textContent = 'x' + mult.toFixed(1);
    timeVal.textContent = formatTime(state.elapsed);

    gaugeFill.style.height = clamp(state.gaugeAnger,0,100).toFixed(1) + '%';
    gaugePct.textContent = Math.round(state.gaugeAnger) + '%';
    gaugeLevel.textContent = 'Lv.' + state.level;

    oyajiWrap.dataset.state = characterVisualState();

    var charging = !state.bonusActive && state.gaugeAnger >= BONUS_GAUGE_THRESHOLD;
    stageEl.classList.toggle('charging', charging);
    stageEl.classList.toggle('bonus', state.bonusActive);
    if (charging){
      chargeLabel.style.display = 'block';
      chargeLabel.textContent = '蓄電中 ' + state.chargeMeter.toFixed(1) + '/' + BONUS_CHARGE_NEEDED + '秒';
    } else {
      chargeLabel.style.display = 'none';
    }

    renderCooldowns();
    renderItemSlots();
    warningMarkEl.classList.toggle('show', state.surpriseActive);
  }

  /* ================= MAIN LOOP ================= */
  function tick(dt){
    state.elapsed += dt;

    var newLevel = 1 + Math.floor(state.elapsed / LEVEL_INTERVAL);
    if (newLevel !== state.level){
      state.level = newLevel;
      if (state.level === SURPRISE_MIN_LEVEL && state.nextSurpriseAt === null && !state.surpriseActive){
        scheduleSurprise();
      }
    }

    var decayMult = Math.max(0, 1 - 0.03*state.level);
    var decay = BASE_DECAY * decayMult;
    if (state.elapsed < state.buffs.sakeDecayUntil) decay *= 2;
    state.gaugeAnger = clamp(state.gaugeAnger - decay*dt, 0, 100);

    Object.keys(state.cooldowns).forEach(function(k){
      if (state.bonusActive){ state.cooldowns[k] = 0; }
      else if (state.cooldowns[k] > 0){ state.cooldowns[k] = Math.max(0, state.cooldowns[k]-dt); }
    });

    if (state.surpriseActive){
      state.surpriseTimer -= dt;
      if (state.surpriseTimer <= 0){
        state.gaugeAnger = clamp(state.gaugeAnger + SURPRISE_PENALTY, 0, 100);
        state.surpriseActive = false;
        showToast('😡 不意打ち発生！怒り+30%');
        scheduleSurprise();
      }
    } else if (state.level >= SURPRISE_MIN_LEVEL && state.nextSurpriseAt !== null && state.elapsed >= state.nextSurpriseAt){
      state.surpriseActive = true;
      state.surpriseTimer = SURPRISE_WINDOW;
      state.nextSurpriseAt = null;
    }

    if (state.gaugeAnger >= 70) state.sessionHighVoltageTime += dt;

    if (!state.bonusActive){
      if (state.gaugeAnger >= BONUS_GAUGE_THRESHOLD){
        state.chargeMeter = Math.min(BONUS_CHARGE_NEEDED, state.chargeMeter + dt);
        if (state.chargeMeter >= BONUS_CHARGE_NEEDED) startBonus();
      }
    } else {
      state.bonusTimeLeft -= dt;
      if (state.bonusTimeLeft <= 0) endBonus();
    }

    updateBasketTiming(dt);
    checkMilestone();

    if (checkGameOver()) return;
    render();
  }

  var lastTs = null;
  function loop(ts){
    if (lastTs === null) lastTs = ts;
    var dt = (ts - lastTs)/1000;
    lastTs = ts;
    if (dt > 0.1) dt = 0.1;
    if (dt < 0) dt = 0;
    if (state.running) tick(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ================= START / RETRY ================= */
  function startGame(){
    resetState();
    state.running = true;
    applySkin(selectedSkin);
    showScreen('game');
    render();
  }

  /* ================= EVENTS ================= */
  Object.keys(cmdButtons).forEach(function(cmd){
    cmdButtons[cmd].addEventListener('click', function(){ performCommand(cmd); });
  });
  itemSlotEls.forEach(function(el, i){
    el.addEventListener('click', function(){ useItem(i); });
  });
  flyingBasketEl.addEventListener('click', catchBasket);
  flyingBasketEl.addEventListener('animationend', missBasket);
  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', function(){
    showScreen('start');
    initMeta();
  });

  /* ================= INIT ================= */
  initMeta();

})();
</script>
</body>
