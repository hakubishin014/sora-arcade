<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文明ダイスクリッカー - 完全版</title>
<style>
  :root {
    --bg-color: #1a1a1a;
    --card-bg: #2d2d2d;
    --accent-color: #e67e22;
    --header-bg: #3d3d3d;
  }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg-color); color: #fff; margin: 0; padding: 20px; text-align: center; user-select: none; transition: background 0.5s; }
  .container { max-width: 520px; margin: 0 auto; background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.6); position: relative; overflow: hidden; transition: background 0.5s; }
  .header { background: var(--header-bg); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
  .cp-display { font-size: 2.4em; color: #ffd700; font-weight: bold; margin: 5px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  
  .board { display: flex; overflow-x: auto; gap: 6px; padding: 12px; background: #111; border-radius: 10px; margin-bottom: 15px; }
  .tile { flex: 0 0 70px; height: 70px; background: #444; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.75em; border-radius: 8px; border: 2px solid transparent; transition: all 0.2s; }
  .tile.active { border-color: #ffd700; background: #775500; font-weight: bold; transform: scale(1.05); box-shadow: 0 0 10px #ffd700; }
  
  .click-area { position: relative; margin-bottom: 15px; }
  .click-btn { width: 100%; height: 90px; font-size: 1.5em; font-weight: bold; background: var(--accent-color); color: white; border: none; border-radius: 12px; cursor: pointer; transition: transform 0.05s, background 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .click-btn:active { transform: scale(0.97); }
  
  .pop-text { position: absolute; font-weight: bold; font-size: 1.6em; color: #ffd700; pointer-events: none; animation: floatUp 0.8s ease-out forwards; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
  }

  .action-panel { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
  .action-row { display: flex; gap: 8px; }
  .action-btn { flex: 1; padding: 12px; background: #2980b9; color: white; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 0.9em; }
  .action-btn:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
  
  .facilities { text-align: left; background: var(--header-bg); padding: 12px; border-radius: 10px; max-height: 250px; overflow-y: auto; }
  .facility-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 6px; }
  .buy-btn { background: #2ecc71; border: none; color: white; padding: 8px 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
  .buy-btn:disabled { background: #777; cursor: not-allowed; opacity: 0.5; }
  
  .status-badge { color: #ff4757; font-weight: bold; margin-bottom: 10px; min-height: 24px; font-size: 0.9em; }
  .timer-info { font-size: 0.8em; color: #aaa; margin-top: 2px; }
  
  .footer-tools { display: flex; justify-content: space-between; margin-top: 15px; font-size: 0.8em; color: #888; }
  .reset-btn { background: transparent; border: 1px solid #666; color: #aaa; border-radius: 4px; padding: 4px 8px; cursor: pointer; }

  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 100; }
  .modal-content { background: #222; padding: 30px; border-radius: 16px; border: 2px solid #ffd700; max-width: 400px; text-align: center; box-shadow: 0 0 20px #ffd700; }
</style>
</head>
<body>

<div class="container" id="main-container">
  <div class="header">
    <div id="era-name" style="font-size: 1.3em; font-weight: bold; color: #3498db;">Stage 1: 原始時代</div>
    <div class="cp-display"><span id="cp-val">0</span> CP</div>
    <div>毎秒生産: <span id="cps-val">0</span> CP/s</div>
  </div>

  <div id="status-message" class="status-badge"></div>

  <h3>🗺️ 双六マップ (位置: <span id="pos-val">0</span> / 9)</h3>
  <div class="board" id="board"></div>

  <div class="action-panel">
    <div class="action-row">
      <button class="action-btn" id="dice-btn" onclick="rollDice()">🎲 ダイスを振る (<span id="dice-val">5</span>/10)</button>
      <button class="action-btn" id="buy-dice-btn" onclick="buyDice()" style="background:#e74c3c;">🛒 ダイス購入 (<span id="dice-cost">100</span> CP)</button>
    </div>
    <div class="timer-info">⏰ 次のダイス自動回復まで: <span id="dice-timer">15</span>秒</div>
    <button class="action-btn" id="advance-btn" onclick="advanceStage()" style="background:#9b59b6; font-size:1.0em;" disabled>🚀 次の時代へ進化</button>
  </div>

  <div class="click-area" id="click-area">
    <button class="click-btn" id="tap-btn" onclick="handleTap(event)">🔥 火を起こす！</button>
  </div>

  <h3>🏛️ 施設・文明開発</h3>
  <div class="facilities" id="facilities"></div>

  <div class="footer-tools">
    <span>💾 自動セーブ有効</span>
    <button class="reset-btn" onclick="resetGame()">データをリセット</button>
  </div>
</div>

<div class="modal" id="win-modal">
  <div class="modal-content">
    <h1 style="color:#ffd700;">🌌 全文明の頂点へ！</h1>
    <p>おめでとうございます！人類は全ステージを攻略し、宇宙の全知全能の文明へと到達しました！</p>
    <p>🎉 プレイしていただきありがとうございました！</p>
    <button class="action-btn" onclick="closeModal()" style="background:#2ecc71;">ゲームを続ける</button>
  </div>
</div>

<script>
// --- Web Audio API 効果音合成 ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  const now = audioCtx.currentTime;
  if (type === 'tap') {
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.05);
    osc.start(now); osc.stop(now + 0.05);
  } else if (type === 'dice') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.setValueAtTime(600, now + 0.08);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  } else if (type === 'buy') {
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.setValueAtTime(659.25, now + 0.08);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  } else if (type === 'fanfare') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.setValueAtTime(659.25, now + 0.1);
    osc.frequency.setValueAtTime(783.99, now + 0.2);
    osc.frequency.setValueAtTime(1046.50, now + 0.3);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.6);
    osc.start(now); osc.stop(now + 0.6);
  }
}

// --- 数値フォーマット (K, M, B, T, Qa, Qi...) ---
function formatNumber(num) {
  if (num < 1000) return Math.floor(num).toString();
  const units = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
  const i = Math.floor(Math.log10(num) / 3);
  if (i >= units.length) return num.toExponential(2);
  const formatted = (num / Math.pow(10, i * 3)).toFixed(2);
  return formatted + units[i];
}

// --- ステージ・データ（全6ステージ） ---
const stages = [
  {
    name: "Stage 1: 原始時代",
    tapText: "🔥 火を起こす！",
    bgColor: "#1a1a1a", cardColor: "#2d2d2d", accentColor: "#e67e22",
    facilities: [
      { id: 0, name: "狩猟採集", cost: 15, cps: 1, count: 0 },
      { id: 1, name: "石器作成", cost: 100, cps: 8, count: 0 },
      { id: 2, name: "洞窟壁画", cost: 1100, cps: 45, count: 0 }
    ]
  },
  {
    name: "Stage 2: 古代文明",
    tapText: "🌾 農業を営む！",
    bgColor: "#2c2211", cardColor: "#3d3019", accentColor: "#d35400",
    facilities: [
      { id: 0, name: "灌漑農業", cost: 1000, cps: 50, count: 0 },
      { id: 1, name: "車輪の製造", cost: 12000, cps: 350, count: 0 },
      { id: 2, name: "ピラミッド建設", cost: 130000, cps: 2100, count: 0 }
    ]
  },
  {
    name: "Stage 3: 中世・ルネサンス",
    tapText: "⚔️ 活版印刷を行う！",
    bgColor: "#13231b", cardColor: "#1d3629", accentColor: "#27ae60",
    facilities: [
      { id: 0, name: "水車小屋", cost: 100000, cps: 3000, count: 0 },
      { id: 1, name: "活版印刷機", cost: 1500000, cps: 25000, count: 0 },
      { id: 2, name: "錬金術工房", cost: 20000000, cps: 180000, count: 0 }
    ]
  },
  {
    name: "Stage 4: 産業革命",
    tapText: "⚙️ 蒸気機関を動かす！",
    bgColor: "#251a2e", cardColor: "#372744", accentColor: "#8e44ad",
    facilities: [
      { id: 0, name: "自動紡績機", cost: 10000000, cps: 200000, count: 0 },
      { id: 1, name: "蒸気機関車", cost: 150000000, cps: 1800000, count: 0 },
      { id: 2, name: "近代化工場", cost: 2000000000, cps: 15000000, count: 0 }
    ]
  },
  {
    name: "Stage 5: 現代",
    tapText: "💻 インターネットを繋ぐ！",
    bgColor: "#112233", cardColor: "#1a334d", accentColor: "#2980b9",
    facilities: [
      { id: 0, name: "火力・原子力発電", cost: 1000000000, cps: 15000000, count: 0 },
      { id: 1, name: "グローバルWebネットワーク", cost: 15000000000, cps: 120000000, count: 0 },
      { id: 2, name: "宇宙ロケット打ち上げ", cost: 200000000000, cps: 1000000000, count: 0 }
    ]
  },
  {
    name: "Stage 6: 宇宙生活",
    tapText: "🚀 ワープ航法を発動！",
    bgColor: "#0a0a23", cardColor: "#14143a", accentColor: "#9b59b6",
    facilities: [
      { id: 0, name: "火星テラフォーミング", cost: 100000000000, cps: 1000000000, count: 0 },
      { id: 1, name: "ダイソン球建造", cost: 1500000000000, cps: 10000000000, count: 0 },
      { id: 2, name: "超光速ワープドライブ", cost: 20000000000000, cps: 100000000000, count: 0 }
    ]
  }
];

const mapTiles = ["スタート", "無地", "文明開化", "フィーバー", "無地", "タイムリープ", "アクシデント", "フィーバー", "タイムリープ", "ゴール"];

// --- 状態管理 ---
let currentStageIndex = 0;
let cp = 0;
let dice = 5;
const maxDice = 10;
let diceTimer = 15;
let diceBuyCost = 100;
let position = 0;
let feverTicks = 0;
let accidentTaps = 0;

// --- セーブ & ロード ---
function saveGame() {
  const data = {
    currentStageIndex, cp, dice, diceTimer, diceBuyCost, position, feverTicks, accidentTaps,
    facilitiesData: stages.map(s => s.facilities.map(f => ({ count: f.count, cost: f.cost })))
  };
  localStorage.setItem("civilization_dice_clicker_save", JSON.stringify(data));
}

function loadGame() {
  const save = localStorage.getItem("civilization_dice_clicker_save");
  if (save) {
    try {
      const data = JSON.parse(save);
      currentStageIndex = data.currentStageIndex || 0;
      cp = data.cp || 0;
      dice = data.dice || 5;
      diceTimer = data.diceTimer || 15;
      diceBuyCost = data.diceBuyCost || 100;
      position = data.position || 0;
      feverTicks = data.feverTicks || 0;
      accidentTaps = data.accidentTaps || 0;
      if (data.facilitiesData) {
        data.facilitiesData.forEach((sFac, sIdx) => {
          if (stages[sIdx]) {
            sFac.forEach((f, fIdx) => {
              if (stages[sIdx].facilities[fIdx]) {
                stages[sIdx].facilities[fIdx].count = f.count;
                stages[sIdx].facilities[fIdx].cost = f.cost;
              }
            });
          }
        });
      }
    } catch (e) { console.error("Save load error", e); }
  }
}

function resetGame() {
  if (confirm("ゲームデータを初期化しますか？")) {
    localStorage.removeItem("civilization_dice_clicker_save");
    location.reload();
  }
}

// --- メインロジック ---
function handleTap(event) {
  playSound('tap');
  let gain = 1 * Math.pow(10, currentStageIndex * 2);
  if (feverTicks > 0) gain *= 100;
  if (accidentTaps > 0) {
    gain = Math.max(1, Math.floor(gain * 0.5));
    accidentTaps--;
  }
  
  cp += gain;
  createPopText(event, `+${formatNumber(gain)}`);
  render();
}

function createPopText(event, text) {
  const area = document.getElementById("click-area");
  const rect = area.getBoundingClientRect();
  const pop = document.createElement("div");
  pop.className = "pop-text";
  pop.innerText = text;
  
  const x = (event ? event.clientX - rect.left : rect.width / 2) + (Math.random() * 40 - 20);
  const y = (event ? event.clientY - rect.top : rect.height / 2) - 10;
  
  pop.style.left = `${x}px`;
  pop.style.top = `${y}px`;
  area.appendChild(pop);
  setTimeout(() => pop.remove(), 800);
}

function getCps() {
  let stage = stages[currentStageIndex];
  let totalCps = stage.facilities.reduce((sum, f) => sum + (f.cps * f.count), 0);
  if (accidentTaps > 0) totalCps = Math.floor(totalCps * 0.5);
  return totalCps;
}

function rollDice() {
  if (dice <= 0) return;
  playSound('dice');
  dice--;
  const roll = Math.floor(Math.random() * 6) + 1;
  position = Math.min(position + roll, mapTiles.length - 1);
  
  const tile = mapTiles[position];
  if (tile === "文明開化") {
    stages[currentStageIndex].facilities[0].count += 1;
  } else if (tile === "フィーバー") {
    feverTicks = 10;
  } else if (tile === "タイムリープ") {
    cp += getCps() * 3600;
  } else if (tile === "アクシデント") {
    accidentTaps = 20;
  }
  
  render();
}

function buyDice() {
  if (cp >= diceBuyCost && dice < maxDice) {
    playSound('buy');
    cp -= diceBuyCost;
    dice++;
    diceBuyCost = Math.floor(diceBuyCost * 1.5);
    render();
  }
}

function buyFacility(index) {
  let f = stages[currentStageIndex].facilities[index];
  if (cp >= f.cost) {
    playSound('buy');
    cp -= f.cost;
    f.count++;
    f.cost = Math.floor(f.cost * 1.15);
    render();
  }
}

function advanceStage() {
  if (position === mapTiles.length - 1 && currentStageIndex < stages.length - 1) {
    playSound('fanfare');
    currentStageIndex++;
    position = 0;
    dice = Math.min(maxDice, dice + 5);
    if (currentStageIndex === stages.length - 1) {
      document.getElementById("win-modal").style.display = "flex";
    }
    render();
  }
}

function closeModal() {
  document.getElementById("win-modal").style.display = "none";
}

// 自動タイマー
setInterval(() => {
  cp += getCps();
  if (feverTicks > 0) feverTicks--;
  
  if (dice < maxDice) {
    diceTimer--;
    if (diceTimer <= 0) {
      dice++;
      diceTimer = 15;
    }
  } else {
    diceTimer = 15;
  }
  
  saveGame();
  render();
}, 1000);

// --- 描画ロジック ---
function render() {
  const stage = stages[currentStageIndex];
  
  document.documentElement.style.setProperty('--bg-color', stage.bgColor);
  document.documentElement.style.setProperty('--card-bg', stage.cardColor);
  document.documentElement.style.setProperty('--accent-color', stage.accentColor);
  
  document.getElementById("era-name").innerText = stage.name;
  document.getElementById("era-name").style.color = stage.accentColor;
  document.getElementById("cp-val").innerText = formatNumber(cp);
  document.getElementById("cps-val").innerText = formatNumber(getCps());
  document.getElementById("dice-val").innerText = dice;
  document.getElementById("dice-timer").innerText = dice < maxDice ? diceTimer : "MAX";
  document.getElementById("dice-cost").innerText = formatNumber(diceBuyCost);
  document.getElementById("pos-val").innerText = position;
  
  document.getElementById("buy-dice-btn").disabled = cp < diceBuyCost || dice >= maxDice;
  document.getElementById("tap-btn").innerText = stage.tapText + (feverTicks > 0 ? " 🔥(100倍フィーバー!)" : "");
  document.getElementById("advance-btn").disabled = !(position === mapTiles.length - 1 && currentStageIndex < stages.length - 1);

  let statusText = "";
  if (feverTicks > 0) statusText += `🔥 フィーバー中！残り ${feverTicks}秒 `;
  if (accidentTaps > 0) statusText += `⚠️ 恐慌発生中！生産量半減（解除まであと ${accidentTaps}回）`;
  document.getElementById("status-message").innerText = statusText;

  const boardEl = document.getElementById("board");
  boardEl.innerHTML = "";
  mapTiles.forEach((tile, i) => {
    const tileEl = document.createElement("div");
    tileEl.className = `tile ${i === position ? "active" : ""}`;
    tileEl.innerHTML = `<div>${i}</div><div>${tile}</div>`;
    boardEl.appendChild(tileEl);
  });

  const facEl = document.getElementById("facilities");
  facEl.innerHTML = "";
  stage.facilities.forEach((f, i) => {
    const item = document.createElement("div");
    item.className = "facility-item";
    item.innerHTML = `
      <div>
        <strong>${f.name}</strong> (所持: ${f.count})<br>
        <small>+${formatNumber(f.cps)} CP/s | コスト: ${formatNumber(f.cost)} CP</small>
      </div>
      <button class="buy-btn" onclick="buyFacility(${i})" ${cp < f.cost ? "disabled" : ""}>購入</button>
    `;
    facEl.appendChild(item);
  });
}

loadGame();
render();
</script>
</body>
</html>
